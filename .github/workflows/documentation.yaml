---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Builds the MkDocs site from docs/ and publishes it to GitHub Pages
# using the Actions deployment model (configure-pages +
# upload-pages-artifact + deploy-pages).
#
# IMPORTANT: in the repository settings under "Pages > Build and
# deployment", the "Source" must read "GitHub Actions" before the
# first deployment succeeds.
name: 'Documentation 📚'

# Runs when the published content changes on the default branch, and
# on manual dispatch for a republish. Pull requests build the site in
# the testing workflow instead, which proves the build without
# granting a pull request head any Pages permission.
# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - 'main'
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/documentation.yaml'
  workflow_dispatch:

permissions: {}

# Serialise every deployment: they all publish to the same site, and
# an out-of-order completion would republish stale content. Queue
# rather than cancel, per the actions/deploy-pages guidance.
concurrency:
  group: 'github-pages'
  cancel-in-progress: false

jobs:
  build:
    name: 'Build site'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: read  # Check out the documentation sources
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: 'Install uv'
        # yamllint disable-line rule:line-length
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          # No caching on a publishing path: a restored cache that a
          # lower-privileged run could populate buys little here and
          # widens the supply chain for the deployed artefact.
          enable-cache: false

      - name: 'Build documentation'
        shell: bash
        # This repository is not a Python package, so the build runs
        # in an ephemeral environment holding the pinned documentation
        # requirements and nothing else. --strict promotes MkDocs
        # warnings (broken links, orphaned pages) to build failures.
        run: |
          uv run --no-project \
            --with-requirements docs/requirements.txt \
            mkdocs build --strict

      - name: 'Upload Pages artifact'
        # yamllint disable-line rule:line-length
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: 'site'

  deploy:
    name: 'Deploy to GitHub Pages'
    needs: build
    runs-on: 'ubuntu-latest'
    permissions:
      pages: write  # Publish the built site to GitHub Pages
      id-token: write  # OIDC token for the Pages deployment
    environment:
      name: 'github-pages'
      url: ${{ steps.deployment.outputs.page_url }}
    timeout-minutes: 10
    steps:
      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: 'audit'

      - name: 'Configure Pages'
        # yamllint disable-line rule:line-length
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - name: 'Deploy to GitHub Pages'
        id: deployment
        # yamllint disable-line rule:line-length
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

      - name: 'Publish site URL to summary'
        if: always()
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## 📚 Documentation published"
            echo ""
            if [ -n "${PAGE_URL}" ]; then
              echo "[${PAGE_URL}](${PAGE_URL})"
            else
              echo "_(deployment did not produce a URL)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
