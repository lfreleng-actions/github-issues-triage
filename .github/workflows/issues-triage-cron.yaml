---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Scheduled thin caller for the reusable issues-triage workflow in
# this repository: 07:00 UTC every weekday, scanning the whole
# organisation this repository belongs to.
#
# Scheduled runs stay in dry-run until the rollout completes (see
# docs/development/DESIGN.md section 11); a manual dispatch can go
# live by unticking dry_run. Egress runs in audit mode until the
# agent session's endpoints land in the org allow-list, then flips
# to block with the tagged allow-list loaded by
# harden-runner-block-action.
#
# Scheduled runs always take the claude engine. A manual dispatch
# picks any of the three; per-engine credentials and their setup
# live in docs/setup/. The reusable workflow refuses live runs on
# the copilot engine and withholds App credentials from it, so
# that engine never holds a write-capable token (DESIGN.md
# section 13.4).
name: 'Issues Triage ⏰'

# yamllint disable-line rule:truthy
on:
  schedule:
    # 07:00 UTC, Monday to Friday
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      engine:
        description: 'Agent engine (copilot forces dry-run, no App)'
        type: choice
        options:
          - claude
          - gemini
          - copilot
        default: 'claude'
      dry_run:
        description: 'Report intended labels; apply nothing'
        type: boolean
        default: true
      retriage:
        description: 'Re-examine issues that carry labels'
        type: boolean
        default: false
      repository:
        description: 'Restrict the scan to one repository'
        type: string
        default: ''

permissions: {}

# Never let two triage sessions race; queue instead. Runs are
# cheap to queue and expensive to interleave: two concurrent agent
# sessions would label against stale snapshots.
concurrency:
  group: 'issues-triage'
  cancel-in-progress: false

jobs:
  triage:
    name: 'Triage'
    permissions:
      # Live labelling uses the App token, never this grant
      issues: read  # Snapshot reads when running without the App
      contents: read  # Asset checkout and repository metadata reads
    uses: ./.github/workflows/issues-triage.yaml
    with:
      # The owner this workflow runs under, which upstream is
      # lfreleng-actions. Naming it this way rather than hard-coding
      # it keeps a fork's scheduled runs inside the fork.
      org: "${{ github.repository_owner }}"
      # Scheduled runs hold the Claude engine; a manual dispatch
      # takes the operator's choice. The fallback covers schedule
      # events, which carry no inputs, and API dispatches that
      # omit this one.
      engine: ${{ inputs.engine || 'claude' }}
      # Scheduled runs are always dry-run during rollout; manual
      # dispatch runs take the operator's choice, except on the
      # copilot engine. The reusable workflow refuses a live run on
      # that engine outright (DESIGN.md section 13.2); forcing the
      # input here turns what would be a failed run into a working
      # dry-run one.
      dry_run: >-
        ${{ github.event_name == 'schedule' || inputs.dry_run ||
        inputs.engine == 'copilot' }}
      retriage: ${{ inputs.retriage || false }}
      repository: ${{ inputs.repository || '' }}
      egress_policy: 'audit'
      # The App variables live at org level; when unset the
      # reusable falls back to github.token (single-repo scope),
      # which suits dry-run rollout. The reusable withholds the App
      # token from the copilot engine itself (DESIGN.md section
      # 13.4), so this passes the client id unconditionally.
      github_app_client_id: ${{ vars.LF_RELENG_BOT_CLIENT_ID || '' }}
      # Run the pipeline with the assets from the triggering commit.
      assets_repository: ${{ github.repository }}
      assets_ref: ${{ github.sha }}
    secrets:
      # Each engine reads one of these; the reusable workflow fails
      # fast when the selected engine's credential is absent.
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      copilot_token: ${{ secrets.COPILOT_CLI_TOKEN }}
      github_app_private_key: ${{ secrets.LF_RELENG_BOT_PRIVATE_KEY }}
