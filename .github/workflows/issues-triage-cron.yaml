---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Scheduled thin caller for the reusable issues-triage workflow in
# this repository: 07:00 UTC every weekday, scanning the whole
# organisation this repository belongs to.
#
# Scheduled runs stay in dry-run until the rollout completes (see
# docs/development/DESIGN.md section 11); a manual dispatch can go
# live by unticking dry_run. Egress runs in audit mode until the
# agent session's endpoints land in the org allow-list, then flips
# to block with the tagged allow-list loaded by
# harden-runner-block-action.
#
# Scheduled runs take the copilot engine: the organisation already
# pays for Copilot, so triage spend draws on an existing
# entitlement rather than a third vendor relationship. A manual
# dispatch picks any of the three; per-engine credentials and
# their setup live in docs/setup/.
#
# The engine proposes and never applies: a later step validates
# the proposal and performs the writes (DESIGN.md section 13.7),
# so this engine's containment gap bounds what the session can
# read rather than what the run can change.
name: 'Issues Triage ⏰'

# yamllint disable-line rule:truthy
on:
  schedule:
    # 07:00 UTC, Monday to Friday
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      engine:
        description: 'Agent engine'
        type: choice
        options:
          - copilot
          - claude
          - gemini
        default: 'copilot'
      dry_run:
        description: 'Test run only, make no changes'
        type: boolean
        default: true
      retriage:
        description: 'Process all open issues, including labelled ones'
        type: boolean
        default: false
      repository:
        description: 'Restrict the scan to one repository'
        type: string
        default: ''

permissions: {}

# Never let two triage sessions race; queue instead. Runs are
# cheap to queue and expensive to interleave: two concurrent agent
# sessions would label against stale snapshots.
concurrency:
  group: 'issues-triage'
  cancel-in-progress: false

jobs:
  triage:
    name: 'Triage'
    permissions:
      # Live labelling uses the App token, never this grant
      issues: read  # Snapshot reads when running without the App
      contents: read  # Asset checkout and repository metadata reads
    uses: ./.github/workflows/issues-triage.yaml
    with:
      # The owner this workflow runs under, which upstream is
      # lfreleng-actions. Naming it this way rather than hard-coding
      # it keeps a fork's scheduled runs inside the fork.
      org: "${{ github.repository_owner }}"
      # Scheduled runs hold the Copilot engine; a manual dispatch
      # takes the operator's choice. The fallback covers schedule
      # events, which carry no inputs, and API dispatches that
      # omit this one.
      engine: ${{ inputs.engine || 'copilot' }}
      # Scheduled runs are always dry-run during rollout; a manual
      # dispatch takes the operator's choice. Pairing a live run
      # with the copilot engine is not silently converted to a dry
      # run here: the reusable workflow refuses that combination
      # with an explicit error (DESIGN.md section 13.2), which
      # tells the operator what happened rather than doing
      # something they did not ask for.
      dry_run: >-
        ${{ github.event_name == 'schedule' || inputs.dry_run }}
      retriage: ${{ inputs.retriage || false }}
      repository: ${{ inputs.repository || '' }}
      egress_policy: 'audit'
      # Credentials for the LF/RelEng Issues Triage Bot App, held
      # at repository level: one workflow consumes them, so an org
      # secret would grant read access to every other repository's
      # workflows for nothing. The two credentials fail
      # differently when absent, which is worth knowing when a run
      # looks wrong: an empty client id skips the mint and leaves
      # the job on github.token, narrowing the scan to this
      # repository, while a missing private key fails the mint
      # step outright. The reusable down-scopes the App token to
      # issues:read on the copilot engine (DESIGN.md section
      # 13.4), so this passes the client id unconditionally and
      # that engine keeps the org-wide reads the scan needs.
      github_app_client_id: ${{ vars.LF_TRIAGE_BOT_CLIENT_ID || '' }}
      # Run the pipeline with the assets from the triggering commit.
      assets_repository: ${{ github.repository }}
      assets_ref: ${{ github.sha }}
    secrets:
      # Each engine reads one of these; the reusable workflow fails
      # fast when the selected engine's credential is absent.
      anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      copilot_token: ${{ secrets.COPILOT_CLI_TOKEN }}
      github_app_private_key: ${{ secrets.LF_TRIAGE_BOT_PRIVATE_KEY }}
