---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Reusable AI issues-triage workflow.
#
# Scans the open issues of an organisation (or a single repository),
# runs an agent session — Claude Code, the Gemini CLI, or the
# GitHub Copilot CLI, selected by the engine input — that *proposes*
# category labels, priority and type per the bundled
# prompt/triage.md policy, and attaches full run evidence to the
# workflow run: before/after issue
# snapshots, engine-specific session evidence (Claude: a turn-by-turn
# transcript; Gemini: telemetry plus the session summary; Copilot:
# CLI logs plus the shared session transcript), and a diff-based
# report that also lands in the step summary.
#
# Two jobs, and the boundary between them is load-bearing. The
# propose job scans and runs the session, holding nothing that can
# write. The apply job validates the proposal and performs the
# writes on a separate runner, from a fresh checkout, against a
# token minted after the first job has ended. A session's shell
# runs unsandboxed as the same user, so anything sharing its job
# shares its workspace and its process table (DESIGN.md 13.2, 13.7).
#
# Consumers outside this organisation supply their own tokens: a
# model credential matching the engine, plus a GitHub App (client id
# input and private-key secret) for any run that applies labels.
# Without App credentials the pipeline runs read-only: dry-run
# reports work with the caller's github.token, and live runs refuse
# to start.
#
# Defaults favour safe onboarding: dry_run (report, change nothing)
# and egress_policy audit. See docs/development/DESIGN.md for the
# full design.
name: 'Issues Triage [R] 🏷️'

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      org:
        description: >-
          GitHub organisation or user to triage. Live runs need
          an organisation: they require App credentials, and the
          apply step's token asks for organisation permissions a
          user installation cannot grant. A user owner is
          dry-run only (DESIGN.md 13.7).
        required: true
        type: string
      engine:
        description: >-
          Agent engine: claude, gemini, or copilot. Every engine
          proposes; a later step applies (DESIGN.md 13.7).
        type: string
        default: 'claude'
      model:
        description: >-
          Model for the agent session. Empty (the default) resolves
          the engine default: claude-opus-5 for claude,
          gemini-3.5-flash-lite for gemini, claude-sonnet-5 for
          copilot.
        type: string
        default: ''
      dry_run:
        description: 'Report intended labels; apply nothing'
        type: boolean
        default: true
      retriage:
        description: 'Re-examine issues that carry labels'
        type: boolean
        default: false
      skip_agent:
        description: 'Plumbing test: skip the agent session entirely'
        type: boolean
        default: false
      repository:
        description: 'Restrict the scan to one repository'
        type: string
        default: ''
      exclude_repos:
        description: 'Comma-separated repos to skip (overrides bundled list)'
        type: string
        default: ''
      max_turns:
        description: >-
          Agent session turn ceiling. The copilot engine ignores
          this: the Copilot CLI exposes no turn cap, so that engine
          is bounded by the agent step's timeout alone.
        type: string
        default: '80'
      egress_policy:
        description: 'harden-runner egress mode: audit or block'
        type: string
        default: 'audit'
      egress_allow_config:
        description: 'harden-runner-block-action config coordinate'
        type: string
        default: ''
      github_app_client_id:
        description: 'GitHub App client id; empty limits runs to dry-run'
        type: string
        default: ''
      assets_repository:
        description: 'Repository providing the prompt and scripts'
        type: string
        default: 'lfreleng-actions/github-issues-triage'
      assets_ref:
        description: >-
          Ref of assets_repository to fetch. Empty (the default)
          locks the assets to the same commit as the called
          workflow file, so pinning the reusable pins its scripts
          and prompt too.
        type: string
        default: ''
    secrets:
      anthropic_api_key:
        description: >-
          Anthropic API key; needed when engine is claude unless
          skip_agent is true. A guard fails fast when the session
          needs it and none arrived.
        required: false
      gemini_api_key:
        description: >-
          Gemini API key (AI Studio); needed when engine is gemini
          unless skip_agent is true. The same guard applies.
        required: false
      copilot_token:
        description: >-
          Token authorising Copilot model requests; needed when
          engine is copilot unless skip_agent is true. Either the
          calling job's GITHUB_TOKEN where that job grants
          'copilot-requests: write' (secretless, billed to the
          organisation), or a fine-grained PAT carrying the
          'Copilot Requests' permission. Classic PATs are refused
          by the CLI. This is the model credential, always
          distinct from the repository-access token that reads and
          labels issues — see docs/setup/GITHUB.md.
        required: false
      github_app_private_key:
        description: 'GitHub App private key (with github_app_client_id)'
        required: false

# Empty workflow-level default: any job added later starts with no
# GITHUB_TOKEN permissions. The triage job below declares its own
# explicit read-only grant, which overrides this workflow-level
# default for that job (job-level permissions take precedence), so
# the caller's grant still reaches it. Live labelling never uses
# GITHUB_TOKEN at all: the App token carries the writes.
permissions: {}

jobs:
  # Scan, assemble the prompt, run the session. This job mints no
  # write-capable credential and writes nothing to GitHub: it
  # produces two artefacts and stops.
  #
  # "Mints" rather than "holds", because one credential arrives
  # already evaluated. On the Copilot engine the copilot_token
  # secret may be a caller GITHUB_TOKEN carrying issues:write
  # (DESIGN.md 13.3), and this workflow cannot narrow a secret a
  # consumer passed in. The guarantee is about what the pipeline
  # issues, not about every value it receives.
  propose:
    name: 'Propose'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    permissions:
      # Live labelling always uses the GitHub App token minted in
      # the apply job, which carries its own permissions, never
      # this fallback GITHUB_TOKEN grant.
      issues: read  # Snapshots and agent reads
      contents: read  # Asset checkout and metadata reads
    # Serialise runs here, not solely in callers: two overlapping
    # sessions would classify the same snapshot and propose
    # conflicting labels. Scoped per caller repository and target
    # org; queued, never cancelled.
    concurrency:
      group: "issues-triage-${{ github.repository }}-${{ inputs.org }}"
      cancel-in-progress: false
    outputs:
      # Facts about the run, crossing to the apply job. Never a
      # credential: that job mints its own, once this one has
      # ended and on a machine this one never touched.
      #
      # The commit the assets checkout actually resolved to, not
      # the caller's assets_ref, which may name a branch: one
      # that moved during the session would otherwise hand the
      # apply job different code to run against the write token.
      assets_sha: "${{ steps.pinned.outputs.sha }}"
      snapshot: "${{ steps.before.outcome }}"
      pending: "${{ steps.before.outputs.pending }}"
      # yamllint disable-line rule:line-length
      proposed: "${{ steps.agent.outcome == 'success' || steps.agent-gemini.outcome == 'success' || steps.agent-copilot.outcome == 'success' }}"
    steps:
      # Load an egress allow-list for block mode. In audit mode the
      # step does not run and harden-runner records outbound calls
      # without blocking, the mode used to harvest the endpoint list.
      - name: 'Load egress allow-list'
        if: inputs.egress_policy == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a # v0.12.1
        with:
          config: "${{ inputs.egress_allow_config }}"

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: "${{ inputs.egress_policy }}"
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # Validate the engine, resolve the model default, and check
      # that the matching credential arrived; fail fast before any
      # spend. skip_agent runs are secretless by design, so they
      # bypass the credential check (never the engine validation).
      #
      # This sits ahead of the App guard below so that an engine
      # which cannot go live at all says so, rather than the App
      # guard first advising credentials that would not help.
      - name: 'Resolve engine and model 🚦'
        id: model
        env:
          ENGINE: "${{ inputs.engine }}"
          MODEL: "${{ inputs.model }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          SKIP_AGENT: "${{ inputs.skip_agent }}"
          ANTHROPIC_KEY: "${{ secrets.anthropic_api_key }}"
          GEMINI_KEY: "${{ secrets.gemini_api_key }}"
          COPILOT_KEY: "${{ secrets.copilot_token }}"
        run: |
          case "$ENGINE" in
            claude)
              default_model='claude-opus-5'
              key="$ANTHROPIC_KEY"
              key_name='anthropic_api_key'
              ;;
            gemini)
              default_model='gemini-3.5-flash-lite'
              key="$GEMINI_KEY"
              key_name='gemini_api_key'
              ;;
            copilot)
              default_model='claude-sonnet-5'
              key="$COPILOT_KEY"
              key_name='copilot_token'
              ;;
            *)
              echo "::error::Unknown engine '$ENGINE'; use claude," \
                "gemini, or copilot."
              exit 1
              ;;
          esac
          if [ "$SKIP_AGENT" != "true" ] && [ -z "$key" ]; then
            echo "::error::Agent runs with engine '$ENGINE' need" \
              "the $key_name secret; pass it, or set skip_agent" \
              "for a secretless plumbing test."
            exit 1
          fi
          model="${MODEL:-$default_model}"
          echo "model=$model" >> "$GITHUB_OUTPUT"
          echo "Engine: $ENGINE | model: $model"

      # Live labelling requires App credentials: the job holds an
      # issues:read fallback token by design, so an App-less live
      # run could never apply a label. Fail fast rather than spend
      # an agent session discovering that.
      - name: 'Require App for live runs 🚦'
        if: ${{ !inputs.dry_run && inputs.github_app_client_id == '' }}
        run: |
          echo "::error::Live runs (dry_run: false) require GitHub" \
            "App credentials (github_app_client_id plus the" \
            "github_app_private_key secret)."
          exit 1

      # Read-only, for the scan and the agent session. No engine
      # applies anything now (DESIGN.md section 13.7), so no
      # session needs write and none is issued. Write arrives
      # later, in its own token, held by a step no agent can
      # influence.
      #
      # Passed unconditionally rather than withheld: github.token
      # is repository-scoped, so a run without an App token would
      # see no repository but its own.
      - name: 'Mint GitHub App token 🔑'
        id: app-token
        if: inputs.github_app_client_id != ''
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          # Scope the token to one repository when the run itself is
          # scoped; an empty value grants the owner installation,
          # which org-wide triage requires.
          repositories: "${{ inputs.repository }}"
          # yamllint disable-line rule:line-length
          permission-issues: 'read'
          permission-metadata: 'read'

      # Resolve the assets ref before checkout, guarding the
      # immutable-pin promise: consumers pinning this workflow to a
      # commit get the assets from that same commit. The job
      # workflow SHA context moved between runner generations, so
      # try both spellings and refuse to fall back to a mutable
      # default branch when neither resolves.
      - name: 'Resolve assets ref 🏷️'
        id: assets
        env:
          ASSETS_REF: "${{ inputs.assets_ref }}"
          # yamllint disable-line rule:line-length
          JOB_WORKFLOW_SHA: "${{ job.workflow_sha || github.job_workflow_sha }}"
        run: |
          ref="${ASSETS_REF:-$JOB_WORKFLOW_SHA}"
          if [ -z "$ref" ]; then
            echo "::error::Cannot determine the called workflow's" \
              "commit on this runner; set assets_ref explicitly to" \
              "keep the assets version-locked."
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Assets ref: $ref"

      - name: 'Checkout triage assets 🛎️'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ steps.assets.outputs.ref }}"
          path: 'triage-assets'
          persist-credentials: false

      # Record the commit that checkout landed on, so the apply
      # job can take the same one. assets_ref may name a branch
      # or a movable tag, and a session lasts twenty minutes --
      # ample for a ref to advance underneath the run and leave
      # the two jobs executing different code.
      - name: 'Pin the assets commit 📌'
        id: pinned
        run: |
          sha="$(git -C triage-assets rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Assets commit: $sha"

      # Without an App the job's token is issues:read, which the
      # guard above pairs with dry-run mode; the requested scope
      # passes through unchanged.
      - name: 'Snapshot issues (before) 📸'
        id: before
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          ORG: "${{ inputs.org }}"
          REPOSITORY: "${{ inputs.repository }}"
          EXCLUDE_REPOS: "${{ inputs.exclude_repos }}"
          EXCLUDE_FILE: 'triage-assets/config/excluded-repos.txt'
        run: |
          bash triage-assets/scripts/snapshot.sh artefacts/before.json
          pending=$(jq 'map(select(.labels == [])) | length' \
            artefacts/before.json)
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          echo "Unlabelled issues pending: $pending"

      # Uploaded before the session starts, never after it ends.
      # An artefact is immutable once uploaded, so this copy sits
      # beyond the reach of anything the agent does next -- and
      # the apply job checks every proposal against it.
      #
      # Passing it through the workspace instead would hand a
      # session that can write files the power to rewrite the
      # very bound its own proposal is measured against, along
      # with the exclusion list naming the repositories triage
      # must leave alone (DESIGN.md section 13.7).
      - name: 'Seal the pre-session evidence 🔒'
        if: steps.before.outcome == 'success'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "triage-evidence-${{ github.run_id }}"
          path: |
            artefacts/before.json
            artefacts/excluded-repos.txt
          retention-days: 7
          if-no-files-found: 'error'

      # Skip the (costly) agent session when the backlog is clear.
      # Retriage mode always runs it: labelled issues are in scope.
      - name: 'Assemble prompt 📝'
        id: prompt
        # yamllint disable rule:line-length
        if: >-
          ${{ !inputs.skip_agent &&
          (steps.before.outputs.pending != '0' || inputs.retriage) }}
        # yamllint enable rule:line-length
        env:
          ORG: "${{ inputs.org }}"
          DRY_RUN: "${{ inputs.dry_run }}"
          RETRIAGE: "${{ inputs.retriage }}"
          REPOSITORY: "${{ inputs.repository }}"
          MAX_TURNS: "${{ inputs.max_turns }}"
        run: |
          {
            cat triage-assets/prompt/triage.md
            echo ""
            echo "## Runtime context"
            echo ""
            echo "- Target organisation: $ORG"
            if [ -n "$REPOSITORY" ]; then
              echo "- Restrict the scan to repository: $REPOSITORY"
            fi
            if [ "$DRY_RUN" = "true" ]; then
              echo "- Mode: DRY RUN. The proposal you emit is" \
                "reported and discarded; nothing is written."
            else
              echo "- Mode: live. The proposal you emit is" \
                "validated and applied by a later step."
            fi
            if [ "$RETRIAGE" = "true" ]; then
              echo "- Retriage mode: re-examine labelled issues too."
            fi
            echo "- Excluded repositories (skip entirely):"
            sed 's/^/    - /' artefacts/excluded-repos.txt
          } > artefacts/prompt.md
          {
            echo "prompt<<TRIAGE_PROMPT_EOF"
            cat artefacts/prompt.md
            echo "TRIAGE_PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"
          # Read verbs only, on every engine and in every mode.
          # Agents propose; the apply step writes (DESIGN.md
          # section 13.7), so no session needs a write grant and
          # none is issued.
          tools="Bash(gh search issues:*),Bash(gh issue list:*)"
          tools="$tools,Bash(gh issue view:*),Bash(gh label list:*)"
          echo "tools=$tools" >> "$GITHUB_OUTPUT"
          # Gemini CLI settings: tools.core is the Gemini analogue
          # of Claude's --allowedTools grant, and
          # model.maxSessionTurns carries the turn ceiling (nested
          # per the settings schema the pinned action documents).
          settings=$(jq -nc \
            --argjson turns "$MAX_TURNS" '
            {
              tools: {
                core: [
                  "run_shell_command(gh search issues)",
                  "run_shell_command(gh issue list)",
                  "run_shell_command(gh issue view)",
                  "run_shell_command(gh label list)"
                ]
              },
              model: {
                maxSessionTurns: $turns
              },
              telemetry: {
                enabled: true,
                target: "local",
                otlpEndpoint: "",
                logPrompts: true,
                outfile: "artefacts/gemini-telemetry.json"
              }
            }')
          echo "gemini_settings=$settings" >> "$GITHUB_OUTPUT"
          # Copilot CLI grants. The CLI approves gh and git commands
          # on their first-level subcommand alone, so
          # 'shell(gh label:*)' matches 'gh label list --repo …'
          # while 'shell(gh label list:*)' matches nothing whatever.
          # Allow rules therefore name the first level and no more.
          # Both forms of each pattern go out because the bare form
          # covers the bare command; neither widens the grant, since
          # both anchor on the same stem.
          patterns() {
            for cmd in "$@"; do
              printf 'shell(%s),shell(%s:*),' "$cmd" "$cmd"
            done
          }
          allow="$(patterns 'gh search' 'gh issue' 'gh label')"
          echo "copilot_allow=${allow%,}" >> "$GITHUB_OUTPUT"
          # Deny rules match the whole command rather than the
          # first level, and outrank every allow rule and any
          # approval the CLI would otherwise infer. They narrow the
          # groups above towards the verbs the policy uses: reads on
          # issues and labels, issue search alone (a 'gh search
          # code' would put repository content in front of the model
          # and into a 90-day artefact).
          #
          # Treat this as defence in depth, NOT as the boundary.
          # Matching keys on the leading words of the command, so
          # two valid gh spellings walk straight past it, both
          # confirmed by run:
          #
          #   gh issue new ...          alias for 'issue create'
          #   gh issue -R o/r edit ...  flag before the subcommand
          #
          # The alias below is named for completeness, but flag
          # placement defeats every entry on the list and no
          # enumeration fixes that. What actually holds writes shut
          # is the token: this engine's session runs with
          # issues:read in every mode (see the mint step), and the
          # run's own writes happen after the session ends, in the
          # apply step, against a credential the agent never sees
          # (DESIGN.md section 13.7). So a live run no longer waits
          # on this list being airtight. The command-vetting hook
          # in section 13.4 still matters, because these gaps let
          # an auto-approved read reach the gh configuration and
          # the CLI's environment.
          deny_cmds=('git' 'gh pr'
            'gh issue close' 'gh issue comment' 'gh issue create'
            'gh issue new'
            'gh issue delete' 'gh issue develop' 'gh issue edit'
            'gh issue lock' 'gh issue pin' 'gh issue reopen'
            'gh issue transfer' 'gh issue unlock' 'gh issue unpin'
            'gh label clone' 'gh label create' 'gh label delete'
            'gh label edit'
            'gh search code' 'gh search commits' 'gh search prs'
            'gh search repos')
          deny="write,$(patterns "${deny_cmds[@]}")"
          echo "copilot_deny=${deny%,}" >> "$GITHUB_OUTPUT"

      - name: 'Run triage agent (Claude) 🤖'
        id: agent
        # yamllint disable rule:line-length
        if: >-
          ${{ inputs.engine == 'claude' && !inputs.skip_agent &&
          (steps.before.outputs.pending != '0' || inputs.retriage) }}
        # yamllint enable rule:line-length
        # Step-level timeout, inside the job's 30-minute ceiling: a
        # session that hits it fails this step alone, leaving the
        # always() evidence steps (transcript, snapshot, report,
        # upload) guaranteed time to run. A job-level timeout would
        # cancel those too.
        timeout-minutes: 20
        # yamllint disable-line rule:line-length
        uses: anthropics/claude-code-action@9c5ddab2e6d17b83ea679153b31f1d5f023cf636 # v1.0.217
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          # Read-only: the session proposes, and the apply step
          # revalidates every proposal against this same scope
          # before writing (DESIGN.md section 13.7).
          TRIAGE_ORG: "${{ inputs.org }}"
          TRIAGE_REPOSITORY: "${{ inputs.repository }}"
          TRIAGE_EXCLUDE_FILE: 'artefacts/excluded-repos.txt'
        with:
          anthropic_api_key: "${{ secrets.anthropic_api_key }}"
          github_token: >-
            ${{ steps.app-token.outputs.token || github.token }}
          prompt: "${{ steps.prompt.outputs.prompt }}"
          claude_args: >-
            --model ${{ steps.model.outputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "${{ steps.prompt.outputs.tools }}"

      # The Gemini engine: same prompt, same wrapper containment
      # (via env), tool grants translated to the Gemini CLI's
      # tools.core allow-list in the settings JSON.
      - name: 'Run triage agent (Gemini) 🤖'
        id: agent-gemini
        # yamllint disable rule:line-length
        if: >-
          ${{ inputs.engine == 'gemini' && !inputs.skip_agent &&
          (steps.before.outputs.pending != '0' || inputs.retriage) }}
        # yamllint enable rule:line-length
        timeout-minutes: 20
        # yamllint disable-line rule:line-length
        uses: google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489 # v0.1.22
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          TRIAGE_ORG: "${{ inputs.org }}"
          TRIAGE_REPOSITORY: "${{ inputs.repository }}"
          TRIAGE_EXCLUDE_FILE: 'artefacts/excluded-repos.txt'
        with:
          gemini_api_key: "${{ secrets.gemini_api_key }}"
          gemini_model: "${{ steps.model.outputs.model }}"
          # Pin the CLI itself: the action defaults this to
          # 'latest', but the CLI enforces the tools.core allow-list
          # and runs with --yolo, making it part of the security
          # boundary. Bumps are deliberate, reviewed edits.
          gemini_cli_version: '0.55.1'
          prompt: "${{ steps.prompt.outputs.prompt }}"
          settings: "${{ steps.prompt.outputs.gemini_settings }}"
          # The pipeline uploads its own evidence bundle; the
          # action's uploader would duplicate it.
          upload_artifacts: false

      # The Copilot engine runs the CLI itself rather than a vendor
      # action: GitHub publishes no first-party Copilot CLI action,
      # and its recommended alternative (github/gh-aw) compiles
      # whole workflows from Markdown, which would replace this
      # pipeline instead of plugging into it. See DESIGN.md
      # section 13. The CLI needs Node 22 or newer, which the runner
      # image does not guarantee.
      - name: 'Set up Node.js (Copilot engine) 🟩'
        # yamllint disable rule:line-length
        if: >-
          ${{ inputs.engine == 'copilot' && !inputs.skip_agent &&
          (steps.before.outputs.pending != '0' || inputs.retriage) }}
        # yamllint enable rule:line-length
        # yamllint disable-line rule:line-length
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Pin the CLI: it enforces the tool allow-list and therefore
      # sits inside the security boundary, exactly as the Gemini
      # engine pins gemini_cli_version. Bumps are reviewed edits.
      #
      # A global CLI install has no lockfile to pin against, so the
      # exact version below is the pin; zizmor's adhoc-packages
      # audit wants a lockfile that cannot exist here.
      - name: 'Install Copilot CLI 📦'
        # yamllint disable rule:line-length
        if: >-
          ${{ inputs.engine == 'copilot' && !inputs.skip_agent &&
          (steps.before.outputs.pending != '0' || inputs.retriage) }}
        # yamllint enable rule:line-length
        env:
          COPILOT_CLI_VERSION: '1.0.80'
        run: |  # zizmor: ignore[adhoc-packages] version pinned above
          npm install -g "@github/copilot@$COPILOT_CLI_VERSION"
          copilot --version

      - name: 'Run triage agent (Copilot) 🤖'
        id: agent-copilot
        # yamllint disable rule:line-length
        if: >-
          ${{ inputs.engine == 'copilot' && !inputs.skip_agent &&
          (steps.before.outputs.pending != '0' || inputs.retriage) }}
        # yamllint enable rule:line-length
        # No turn ceiling exists for this engine (max_turns has no
        # Copilot CLI analogue), so this timeout is the only bound
        # on a runaway session.
        timeout-minutes: 20
        env:
          # Two variables, two jobs. The CLI reads
          # COPILOT_GITHUB_TOKEN ahead of GH_TOKEN, so setting both
          # keeps model access and repository access apart: the
          # repository credential never reaches the Copilot
          # backend.
          #
          # The reverse does not follow. Routing a value into its
          # own variable says nothing about that value's scope. A
          # fine-grained PAT carrying Copilot Requests alone
          # reaches nothing but the model, but a caller passing its
          # own GITHUB_TOKEN hands over whatever that job granted,
          # issues:write included. Callers choosing that route keep
          # the job read-only themselves; this workflow cannot
          # narrow a secret it receives already evaluated. See
          # docs/setup/GITHUB.md.
          COPILOT_GITHUB_TOKEN: "${{ secrets.copilot_token }}"
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          TRIAGE_ORG: "${{ inputs.org }}"
          TRIAGE_REPOSITORY: "${{ inputs.repository }}"
          TRIAGE_EXCLUDE_FILE: 'artefacts/excluded-repos.txt'
          # Keep CLI configuration and session state in the runner's
          # scratch space, so nothing persists in the home directory
          # between steps or influences the session.
          COPILOT_HOME: "${{ runner.temp }}/copilot"
          # Where the agent's own gh commands find their credential.
          # Outside the workspace, so the artefact upload never
          # collects it.
          GH_CONFIG_DIR: "${{ runner.temp }}/gh-config"
          MODEL: "${{ steps.model.outputs.model }}"
          ALLOW_TOOLS: "${{ steps.prompt.outputs.copilot_allow }}"
          DENY_TOOLS: "${{ steps.prompt.outputs.copilot_deny }}"
          # Shell tools and nothing else. --available-tools is the
          # CLI's hard limit ('the model won't be able to use it at
          # all'), unlike --allow-tool, which pre-approves commands
          # but leaves read-only shell auto-approved. This drops
          # file writes, patching, web_fetch, skills, and subagents
          # out of reach entirely. The four names below are the
          # shell tools the CLI actually registers: one to run a
          # command, three to manage backgrounded ones.
          AVAILABLE_TOOLS: >-
            bash,list_bash,read_bash,stop_bash
        run: |
          mkdir -p artefacts/copilot-logs
          # Authenticate the agent's gh through a configuration file
          # rather than its environment. --secret-env-vars strips
          # the variables it names from every shell the agent runs,
          # not merely from the output, so a GH_TOKEN named there
          # would leave every gh command in the session
          # unauthenticated. Seeding the config keeps gh working
          # while the credential stays out of the agent's own
          # environment, and value-based redaction still covers it
          # because this step's own process keeps GH_TOKEN set.
          #
          # Worth being precise about what that buys: it removes
          # the easiest route to the token, not every route. Shell
          # commands run unsandboxed as this user, so an
          # auto-approved read reaches this file or the CLI's own
          # environment one process up. Redaction covers both, and
          # a transformation defeats redaction. See DESIGN.md
          # section 13.2; the vetting hook in 13.4 is what closes
          # it.
          #
          # Writing hosts.yml directly rather than running
          # 'gh auth login --with-token' avoids that command's
          # validating API call, which a GitHub App installation
          # token cannot make.
          hosts="$GH_CONFIG_DIR/hosts.yml"
          mkdir -p "$GH_CONFIG_DIR"
          (
            umask 077
            printf 'github.com:\n    oauth_token: %s\n' "$GH_TOKEN" \
              > "$hosts"
            printf '    git_protocol: https\n' >> "$hosts"
          )
          prompt="$(cat artefacts/prompt.md)"
          # --disable-builtin-mcps removes the bundled GitHub MCP
          #   server, whose label_write tool would otherwise write
          #   labels directly, bypassing the validation the apply
          #   step performs
          # --no-custom-instructions stops AGENTS.md and friends in
          #   the assets checkout from steering the session
          # --no-ask-user keeps the session autonomous; without it a
          #   question would stall until the timeout
          # --secret-env-vars covers GH_TOKEN: the CLI redacts
          #   GITHUB_TOKEN and COPILOT_GITHUB_TOKEN by default but
          #   not the App token, which this step writes into logs
          #   and a transcript that ship in a 90-day artefact
          copilot \
            --prompt="$prompt" \
            --model="$MODEL" \
            --available-tools="$AVAILABLE_TOOLS" \
            --allow-tool="$ALLOW_TOOLS" \
            --deny-tool="$DENY_TOOLS" \
            --secret-env-vars="GH_TOKEN,COPILOT_GITHUB_TOKEN" \
            --no-ask-user \
            --no-custom-instructions \
            --disable-builtin-mcps \
            --no-auto-update \
            --no-color \
            --log-dir=artefacts/copilot-logs \
            --share=artefacts/session-summary.md

      # Preserve the full session transcript for debugging, whatever
      # the session outcome. The failure cases are precisely the runs
      # that need it. Claude exposes a structured execution log;
      # Gemini's telemetry writes into artefacts/ directly (see the
      # settings JSON) and its summary output lands beside it;
      # Copilot writes its logs and shared transcript into
      # artefacts/ itself.
      - name: 'Preserve session transcript 📜'
        if: always() && steps.before.outcome == 'success'
        env:
          EXECUTION_FILE: "${{ steps.agent.outputs.execution_file }}"
          GEMINI_SUMMARY: "${{ steps.agent-gemini.outputs.summary }}"
        run: |
          if [ -n "$EXECUTION_FILE" ] && [ -f "$EXECUTION_FILE" ]; then
            cp "$EXECUTION_FILE" artefacts/session-transcript.json
            echo "Transcript preserved from: $EXECUTION_FILE"
            # Claude's action exposes a transcript and no shared
            # summary, so the proposal has to be lifted out of it
            # or the apply step would find nothing and skip every
            # Claude run in silence. The file is one pretty-printed
            # JSON array -- JSON.stringify(messages, null, 2) --
            # so it is decoded whole, not line by line.
            python3 - "$EXECUTION_FILE" <<'EXTRACT'
          import json, sys, pathlib

          try:
              events = json.loads(
                  pathlib.Path(sys.argv[1]).read_text(
                      encoding="utf-8", errors="replace"
                  )
              )
          except json.JSONDecodeError as exc:
              print(f"Could not decode the Claude transcript: {exc}")
              raise SystemExit(0)
          if not isinstance(events, list):
              print("Claude transcript is not a list of events")
              raise SystemExit(0)

          final = ""
          for event in events:
              if not isinstance(event, dict):
                  continue
              if isinstance(event.get("result"), str):
                  final = event["result"]
                  continue
              message = event.get("message")
              if event.get("type") == "assistant" and isinstance(message, dict):
                  # Join the text blocks rather than keeping the
                  # last. A response can arrive split across
                  # several, and taking one would slice the
                  # proposal -- losing the opening fence while
                  # still looking like a successful run.
                  blocks = [
                      block["text"]
                      for block in message.get("content") or []
                      if (
                          isinstance(block, dict)
                          and block.get("type") == "text"
                          and isinstance(block.get("text"), str)
                      )
                  ]
                  if blocks:
                      final = "".join(blocks)
          if final:
              pathlib.Path("artefacts/session-summary.md").write_text(
                  final, encoding="utf-8"
              )
              print("Claude final message captured for the apply step")
          else:
              print("No final Claude message found in the transcript")
          EXTRACT
          elif [ -f artefacts/gemini-telemetry.json ]; then
            echo "Gemini telemetry captured in artefacts/"
          elif [ -d artefacts/copilot-logs ]; then
            echo "Copilot session logs captured in artefacts/"
          else
            echo "No session transcript to preserve"
          fi
          if [ -n "$GEMINI_SUMMARY" ]; then
            printf '%s\n' "$GEMINI_SUMMARY" \
              > artefacts/session-summary.md
            echo "Gemini session summary preserved"
          elif [ -f artefacts/session-summary.md ]; then
            echo "Session summary already present in artefacts/"
          fi

      # The session's own output, the proposal among it. Kept in
      # a separate artefact from the evidence above, with no file
      # in common, so the apply job draws the two from different
      # places and trusts them differently.
      - name: 'Preserve session output 📤'
        if: always() && steps.before.outcome == 'success'
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "triage-session-${{ github.run_id }}"
          path: |
            artefacts/prompt.md
            artefacts/session-summary.md
            artefacts/session-transcript.json
            artefacts/gemini-telemetry.json
            artefacts/copilot-logs/
          retention-days: 7
          if-no-files-found: 'warn'

  # Validate the proposal and perform the writes, on a runner the
  # session never touched.
  #
  # The job boundary is the whole point. A session's shell runs
  # unsandboxed as the same user (DESIGN.md section 13.2), so
  # whatever shares its job shares three things with it: the
  # workspace the applier would run from, the process table, and
  # any credential minted while one of its processes is still
  # alive -- and the runner reaps orphans when the job ends, not
  # when the step does. Ordering steps within one job closed none
  # of those. A second job closes all three at once.
  #
  # What crosses the boundary is data, never code or credentials.
  # The scripts arrive from a fresh checkout of the same
  # immutable ref, the snapshot from an artefact sealed before
  # the session began, and the write token is minted here.
  apply:
    name: 'Apply'
    needs: 'propose'
    # Runs even where the session failed, so the report still
    # gets built and the run still explains itself. The apply
    # step carries its own guard.
    if: always() && needs.propose.outputs.snapshot == 'success'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      issues: read  # After-snapshot reads; writes use the App token
      contents: read  # Asset checkout and metadata reads
    # A group of its own rather than the proposing job's. Sharing
    # one would leave this queued behind some other run's agent
    # session; what must not overlap an apply is another apply.
    concurrency:
      # yamllint disable-line rule:line-length
      group: "issues-triage-apply-${{ github.repository }}-${{ inputs.org }}"
      cancel-in-progress: false
    steps:
      - name: 'Load egress allow-list'
        if: inputs.egress_policy == 'block'
        # yamllint disable-line rule:line-length
        uses: lfreleng-actions/harden-runner-block-action@805eedb0508c07714b61887a2b87a5c4bbeff22a # v0.12.1
        with:
          config: "${{ inputs.egress_allow_config }}"

      - name: 'Harden runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: "${{ inputs.egress_policy }}"
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      # The exact commit the session ran against, taken from git.
      # A SHA, never the caller's ref: that may have moved while
      # the session ran.
      - name: 'Checkout triage assets 🛎️'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: "${{ inputs.assets_repository }}"
          ref: "${{ needs.propose.outputs.assets_sha }}"
          path: 'triage-assets'
          persist-credentials: false

      # The snapshot and exclusion list as they stood before the
      # session ran.
      - name: 'Fetch sealed evidence 📥'
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: "triage-evidence-${{ github.run_id }}"
          path: 'artefacts'

      # The proposal and the transcript. Untrusted input, which
      # is why it lands after the evidence and shares no filename
      # with it. A session that failed may have left nothing, and
      # that must not stop the report.
      - name: 'Fetch session output 📥'
        continue-on-error: true
        # yamllint disable-line rule:line-length
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: "triage-session-${{ github.run_id }}"
          path: 'artefacts'

      # Read-only, for the after-snapshot. Minted again here
      # rather than carried over: a token is not something this
      # design passes between jobs.
      - name: 'Mint GitHub App token 🔑'
        id: app-token
        if: inputs.github_app_client_id != ''
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          repositories: "${{ inputs.repository }}"
          permission-issues: 'read'
          permission-metadata: 'read'

      # A second token for the apply step. Narrowed, but to four
      # grants rather than two: the applier reads the
      # organisation's issue fields and types to validate priority
      # and type before writing them.
      #
      # create-github-app-token declares no inputs for those two,
      # because its permission list is generated and predates
      # them. It reads any INPUT_PERMISSION-* variable though, so
      # the undeclared pair below reaches the token request as
      # issue_fields and issue_types -- the names the installation
      # itself reports. Actions warns about unexpected inputs; the
      # alternative is an unnarrowed token inheriting every
      # installation grant, which is worse.
      #
      # Minted for dry runs too, because validation needs the same
      # reads. No session can reach it: the job holding them has
      # ended, and its processes with it.
      #
      # issue_fields and issue_types are organisation permissions,
      # so this mint needs an organisation owner. A user-owned
      # installation cannot grant them and the request fails.
      # Pairing that with the live-run guard in the propose job,
      # which refuses an App-less live run outright, leaves a
      # user owner dry-run only -- as the org input says.
      # Degrading here instead would be worse: a live run that
      # quietly dropped every priority would look like it worked.
      - name: 'Mint App token for the apply step 🔐'
        id: app-token-write
        # yamllint disable-line rule:line-length
        if: ${{ inputs.github_app_client_id != '' && needs.propose.outputs.proposed == 'true' }}
        # yamllint disable-line rule:line-length
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: "${{ inputs.github_app_client_id }}"
          private-key: "${{ secrets.github_app_private_key }}"
          owner: "${{ inputs.org }}"
          repositories: "${{ inputs.repository }}"
          # Write only when a write is coming. Dry runs validate
          # and stop, so they take the same read-only grant the
          # agent's token has -- keeping "dry run" a property of
          # the credential and not merely of a flag.
          # yamllint disable-line rule:line-length
          permission-issues: "${{ inputs.dry_run && 'read' || 'write' }}"
          permission-metadata: 'read'
          permission-issue-fields: 'read'
          permission-issue-types: 'read'

      # The agent proposes; this applies. The two sit in separate
      # jobs, so the credential minted above never coexists with
      # a session on one machine, and the script below comes from
      # git rather than from anywhere a session could write.
      # Everything the agent emitted is revalidated here against
      # the run's own scope before it reaches GitHub.
      #
      # This step also carries priority and type. Priority needs
      # the REST issue-field endpoint, which gh issue edit cannot
      # reach; type uses gh issue edit --type. Both need the
      # organisation reads the token above preserves.
      - name: 'Apply triage proposal 🏷️'
        id: apply
        # Only a session that finished has a proposal worth
        # trusting. A failed or timed-out one may have left a
        # partial transcript, and applying half a plan is worse
        # than applying none.
        if: needs.propose.outputs.proposed == 'true'
        env:
          # yamllint disable-line rule:line-length
          GH_TOKEN: "${{ steps.app-token-write.outputs.token || steps.app-token.outputs.token || github.token }}"
          TRIAGE_ORG: "${{ inputs.org }}"
          TRIAGE_REPOSITORY: "${{ inputs.repository }}"
          TRIAGE_EXCLUDE_FILE: 'artefacts/excluded-repos.txt'
          TRIAGE_RETRIAGE: "${{ inputs.retriage }}"
          DRY_RUN: "${{ inputs.dry_run }}"
        run: |
          if [ ! -f artefacts/session-summary.md ]; then
            # The guard above already established that an agent
            # session succeeded, so a missing proposal means the
            # export or extraction failed rather than that the
            # agent had nothing to say. Exiting clean here would
            # report a live run as green having applied nothing.
            echo "::error::An agent session completed but left no" \
              "proposal at artefacts/session-summary.md."
            exit 1
          fi
          extra=()
          if [ "$DRY_RUN" = "true" ]; then
            extra+=(--dry-run)
          fi
          python3 triage-assets/scripts/apply_triage.py \
            --proposal artefacts/session-summary.md \
            --snapshot artefacts/before.json \
            --output-json artefacts/apply-result.json \
            "${extra[@]}"

      - name: 'Snapshot issues (after) 📸'
        if: always()
        env:
          GH_TOKEN: "${{ steps.app-token.outputs.token || github.token }}"
          ORG: "${{ inputs.org }}"
          REPOSITORY: "${{ inputs.repository }}"
          EXCLUDE_REPOS: "${{ inputs.exclude_repos }}"
          EXCLUDE_FILE: 'triage-assets/config/excluded-repos.txt'
        run: |
          bash triage-assets/scripts/snapshot.sh artefacts/after.json

      # The report diffs the snapshots: it shows observed label
      # movement, never the agent's own claims about what it did.
      - name: 'Build report 📊'
        if: always()
        env:
          DRY_RUN: "${{ inputs.dry_run }}"
        run: |
          extra=()
          if [ -f artefacts/after.json ]; then
            extra+=(--after artefacts/after.json)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            extra+=(--dry-run)
          fi
          python3 triage-assets/scripts/triage_report.py \
            --before artefacts/before.json \
            --transcript artefacts/session-transcript.json \
            --output-md artefacts/triage-report.md \
            --output-json artefacts/triage-report.json \
            "${extra[@]}"

      - name: 'Attach run artefacts 📎'
        if: always()
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "issues-triage-${{ github.run_id }}"
          path: 'artefacts/'
          retention-days: 90
          if-no-files-found: 'warn'
