# Tool configuration for the helper scripts in scripts/. This
# repository is not a Python package; the file exists so the
# type-checker runs in the organisation's standard mode rather
# than basedpyright's default "recommended" mode, which bans Any
# outright and cannot accommodate stdlib-json handling.

[tool.basedpyright]
typeCheckingMode = "strict"
